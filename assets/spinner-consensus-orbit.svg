<svg id="genlayer-spinner-orbit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="comet-glow" x="-20%" y="-25%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- UserSpaceOnUse Gradients for the fading comet tails -->
    <linearGradient id="comet-grad-1" x1="60" y1="34" x2="86" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="0" />
      <stop offset="30%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="comet-grad-2" x1="60" y1="22" x2="98" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="0" />
      <stop offset="30%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="comet-grad-3" x1="60" y1="10" x2="110" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="0" />
      <stop offset="30%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--gen-cobalt, #110FFF)" stop-opacity="1" />
    </linearGradient>

    <style>
      :root {
        --gen-cobalt: #110FFF;
      }

      /* Orbit Track Styles */
      .orbit-track {
        fill: none;
        stroke: var(--gen-cobalt, #110FFF);
        stroke-opacity: 0.08;
        stroke-width: 1;
      }

      /* Comet Group Rotations */
      .comet-group-inner {
        transform-origin: 60px 60px;
        animation: spin-clockwise 1.4s linear infinite;
      }

      .comet-group-middle {
        transform-origin: 60px 60px;
        animation: spin-counter-clockwise 2.2s linear infinite;
      }

      .comet-group-outer {
        transform-origin: 60px 60px;
        animation: spin-clockwise 3s linear infinite;
      }

      /* Central Diamond Pulse */
      .center-diamond {
        fill: var(--gen-cobalt, #110FFF);
        transform-origin: 60px 66px;
        animation: consensus-heartbeat 1.8s ease-in-out infinite;
        filter: url(#comet-glow);
      }

      /* Animation keyframes */
      @keyframes spin-clockwise {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes spin-counter-clockwise {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes consensus-heartbeat {
        0%, 100% {
          transform: scale(0.8);
          fill: var(--gen-cobalt, #110FFF);
          fill-opacity: 0.6;
          filter: drop-shadow(0 0 1px var(--gen-cobalt, #110FFF));
        }
        50% {
          transform: scale(1.15);
          fill: #00FF66; /* Momentary Green success flash represents consensus reached */
          fill-opacity: 1;
          filter: drop-shadow(0 0 8px #00FF66);
        }
      }
    </style>
  </defs>

  <!-- Static Orbit Tracks -->
  <circle class="orbit-track" cx="60" cy="60" r="26" />
  <circle class="orbit-track" cx="60" cy="60" r="38" />
  <circle class="orbit-track" cx="60" cy="60" r="50" />

  <!-- Inner Orbit Comet (Clockwise) -->
  <g class="comet-group-inner">
    <path d="M 60 34 A 26 26 0 0 1 86 60" fill="none" stroke="url(#comet-grad-1)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="86" cy="60" r="3" fill="var(--gen-cobalt, #110FFF)" filter="url(#comet-glow)" />
  </g>

  <!-- Middle Orbit Comet (Counter-Clockwise) -->
  <g class="comet-group-middle">
    <path d="M 60 22 A 38 38 0 0 1 98 60" fill="none" stroke="url(#comet-grad-2)" stroke-width="3" stroke-linecap="round" />
    <circle cx="98" cy="60" r="3.5" fill="var(--gen-cobalt, #110FFF)" filter="url(#comet-glow)" />
  </g>

  <!-- Outer Orbit Comet (Clockwise) -->
  <g class="comet-group-outer">
    <path d="M 60 10 A 50 50 0 0 1 110 60" fill="none" stroke="url(#comet-grad-3)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="110" cy="60" r="4" fill="var(--gen-cobalt, #110FFF)" filter="url(#comet-glow)" />
  </g>

  <!-- Pulsing Consensus Diamond in Center -->
  <!-- Target Center is 60,66. -->
  <path class="center-diamond" d="M 60.00,58.62 L 66.00,70.50 L 60.00,73.45 L 54.31,70.49 Z" />
</svg>
